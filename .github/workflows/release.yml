name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: '把构建产物提交回仓库的 releases/ 目录'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- Windows: x64 + x86(32 位) ----------
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build NSIS installer (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SnapGit-bin-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------- macOS: Apple Silicon + Intel ----------
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Build dmg (${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles dmg

      # Tauri 的 dmg bundler 只设置卷宗图标（挂载后），不设置 dmg 文件本身的 Finder 图标
      # （在 macOS Finder 列表里看到的 .dmg 文件图标）。这里补一刀，让 dmg 文件本身也显示 SnapGit 图标。
      # 原理：dmg → UDRW → 挂载 → 写 Icon\r + SetFile -a C → 卸载 → 转回 UDZO
      # 仅 macOS + Xcode CLT 可跑，所以放在 build-macos job 里。
      - name: Inject custom Finder icon into dmg (${{ matrix.arch }})
        run: |
          chmod +x scripts/dmg-icon-inject.sh
          bash scripts/dmg-icon-inject.sh \
            src-tauri/icons/icon.icns \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Verify dmg icons
        run: |
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/dmg/
          # 简单 smoke check：图标脚本退出 0 且产物存在
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            test -s "$f" || { echo "dmg 为空: $f" >&2; exit 1; }
          done

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: SnapGit-bin-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------- 汇总：所有平台产物统一放进 releases/ ----------
  collect:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect all artifacts into releases/
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: SnapGit-bin-*
          merge-multiple: true

      - name: List releases contents
        run: ls -lh releases

      - name: Upload unified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: SnapGit-Release
          path: releases
          if-no-files-found: error

      # 推 tag（v*）时发布到 GitHub Release 页面
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动触发且勾选时，把产物提交回仓库 releases/ 目录
      # （tag 推送时 checkout 处于 detached HEAD，不适合回写分支，故仅限手动触发）
      - name: Commit releases/ to repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_to_repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases
          if git diff --cached --quiet; then
            echo "releases/ 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(release): update releases artifacts (#$GITHUB_RUN_NUMBER)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
